project_analysis:
  project_name: "finanzas-app"
  repository_type: "monorepo"
  package_manager: "pnpm"
  build_system: "TurboRepo"

current_tech_stack:
  frontend:
    framework: "React 18 + TypeScript"
    build_tool: "Vite"
    styling: "Tailwind CSS + shadcn/ui"
    state_management: "TanStack Query + Zustand"
    charts: "Recharts via shadcn/charts"
  backend:
    runtime: "Node.js + Express"
    orm: "Prisma"
    database: "SQLite"
    validation: "Zod"
  tooling:
    monorepo_manager: "TurboRepo"
    package_manager: "pnpm"
    linting: "ESLint"
    testing: "Not configured"

priority_improvements:
  - id: "TS-001"
    title: "Centralize TypeScript Configuration"
    description: "Create shared tsconfig.base.json to eliminate duplication"
    priority: "HIGH"
    prerequisites: []
    success_metrics:
      - "Single source of truth for compiler options"
      - "Reduced maintenance overhead"
      - "Consistent TypeScript behavior across packages"

  - id: "TURBO-001"
    title: "Optimize TurboRepo Caching Strategy"
    description: "Configure advanced caching for faster CI/CD and development"
    priority: "HIGH"
    prerequisites: ["TS-001"]
    success_metrics:
      - "Cache hits > 90% in development"
      - "Build times reduced by 40%"
      - "CI pipeline optimized"

  - id: "ESLINT-001"
    title: "Simplify and Unify ESLint Configuration"
    description: "Remove redundant plugins, standardize rules across packages"
    priority: "HIGH"
    prerequisites: []
    success_metrics:
      - "Reduced bundle size of linting dependencies"
      - "Consistent code style enforcement"
      - "Faster linting execution"

  - id: "EXPRESS-001"
    title: "Refactor Error Handling in Express"
    description: "Replace express-async-errors with structured error middleware"
    priority: "HIGH"
    prerequisites: []
    success_metrics:
      - "Removed external dependency"
      - "Consistent error response format"
      - "Better TypeScript integration for error types"

  - id: "GIT-001"
    title: "Optimize Git Configuration for Monorepo"
    description: "Clean .gitignore, add proper patterns for pnpm/TurboRepo"
    priority: "MEDIUM"
    prerequisites: []
    success_metrics:
      - "Cleaner repository status"
      - "Proper exclusion of build artifacts"
      - "Optimized for monorepo structure"

implementation_phases:
  phase_1:
    name: "Foundation Consolidation"
    tasks: ["TS-001", "GIT-001"]
    objective: "Establish clean shared configuration baseline"

  phase_2:
    name: "Build System Optimization"
    tasks: ["TURBO-001"]
    objective: "Maximize development speed through caching"

  phase_3:
    name: "Code Quality Tooling"
    tasks: ["ESLINT-001"]
    objective: "Streamline linting and code consistency"

  phase_4:
    name: "Backend Architecture"
    tasks: ["EXPRESS-001"]
    objective: "Improve error handling and remove dependencies"

technical_details:
  tsconfig_improvements:
    recommended_base_config:
      extends: "@tsconfig/strictest"
      compiler_options:
        composite: true
        declaration: true
        declarationMap: true
        incremental: true
        tsBuildInfoFile: "node_modules/.tsbuildinfo"

  turbo_optimizations:
    cache_strategies:
      - "env-aware-hashing"
      - "remote-caching-ready"
      - "dependent-task-optimization"
    pipeline_config:
      key_optimizations:
        - "persistent-task-outputs"
        - "cache-input-patterns"

  eslint_simplification:
    plugins_to_evaluate:
      - "@typescript-eslint"
      - "import"
      - "react-hooks"
    plugins_to_remove:
      - "eslint-plugin-cypress" # If not used
      - "eslint-config-prettier" # If using prettier separately

  express_error_handling:
    current_approach: "express-async-errors wrapper"
    recommended_approach: "Custom async middleware with Zod validation"
    benefits:
      - "Type-safe error responses"
      - "No magic dependency"
      - "Better stack traces"
