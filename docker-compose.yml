version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: finanzas_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-finanzas}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U finanzas_user" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
